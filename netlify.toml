[build]
  command = "npm run build"
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# Old blog post URLs (blog.voyagebyluna.com, Jekyll) -> the Journal. PERMANENT.
# Written un-encoded on purpose: Netlify decodes the request path before matching,
# so "%20" in a rule never matches but a real space does. Generated once from each
# post's legacy_url during the migration; these old URLs never change.
# ---------------------------------------------------------------------------
