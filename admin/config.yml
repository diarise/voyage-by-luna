# Decap Turbo + GitHub. Edits are saved to the `main` branch (production).
backend:
  name: turbo-github
  turbo_site_id: 3ef0c896-049e-4100-b50a-181f68e6e8cf
  branch: main

site_url: https://voyagebyluna.com
logo_url: /images/logo-full.png

# Where uploaded photos go, and the URL prefix used to reference them
media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  # ---------------------------------------------------------------
  # Journal (blog) — one entry per article, shown at /blog/
  # ---------------------------------------------------------------
  - name: "journal"
    label: "Journal (Blog Posts)"
    label_singular: "Journal Post"
    description: "Articles for voyagebyluna.com/blog/. Tick Draft to save a post without publishing it."
    folder: "src/blog/posts"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date | date('MMM D, YYYY')}}{{draft | ternary(' (draft)', '')}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - { label: "Drafts", field: "draft", pattern: true }
      - { label: "Featured", field: "featured", pattern: true }
    media_folder: "/images/blog"
    public_folder: "/images/blog"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Draft (not shown on the site)", name: "draft", widget: "boolean", default: true }
      - label: "Section"
        name: "section"
        widget: "select"
        options:
          - { label: "Destination Guides", value: "destination-guides" }
          - { label: "Culture & Heritage", value: "culture-heritage" }
          - { label: "Theme Parks & Family", value: "theme-parks-family" }
          - { label: "Beaches & Romance", value: "beaches-romance" }
          - { label: "Travel Advice", value: "travel-advice" }
          - { label: "Careers in Travel", value: "careers-in-travel" }
      - label: "Destinations in this post"
        name: "destinations"
        widget: "select"
        multiple: true
        required: false
        hint: "Adds the post to that destination's page. Ask Daouda to add a new destination to the list."
        options:
          - { label: "Japan", value: "japan" }
          - { label: "South Korea", value: "south-korea" }
          - { label: "Philippines", value: "philippines" }
          - { label: "Bali", value: "bali" }
          - { label: "Bora Bora", value: "bora-bora" }
          - { label: "Seychelles", value: "seychelles" }
          - { label: "Punta Cana", value: "punta-cana" }
          - { label: "Portugal", value: "portugal" }
          - { label: "Ghana", value: "ghana" }
          - { label: "California", value: "california" }
          - { label: "Florida", value: "florida" }
      - { label: "Short summary (shown under the title and on cards)", name: "excerpt", widget: "text" }
      - { label: "Main photo", name: "image", widget: "image" }
      - { label: "Main photo description (for screen readers and Google)", name: "image_alt", widget: "string", hint: "Describe what's in the photo, e.g. 'Overwater bungalows in Bora Bora at sunset'." }
      - label: "Main photo type"
        name: "image_style"
        widget: "select"
        default: "photo"
        options:
          - { label: "Photo (fills the width)", value: "photo" }
          - { label: "Graphic with text (shown whole, never cropped)", value: "graphic" }
      - { label: "Photo caption (optional)", name: "image_caption", widget: "string", required: false }
      - { label: "Photo credit (optional, e.g. 'Photo: Pexels')", name: "image_credit", widget: "string", required: false }
      - label: "Article"
        name: "body"
        widget: "markdown"
        hint: "To add a YouTube video, paste its link on a line by itself."
      - { label: "YouTube video at the end (optional)", name: "video", widget: "string", required: false }
      - { label: "Feature this post at the top of the Journal", name: "featured", widget: "boolean", default: false }
      - { label: "Contains affiliate links (shows a disclosure note)", name: "affiliate", widget: "boolean", default: false }
      - label: "Book-it-yourself partners (optional)"
        name: "partners"
        widget: "select"
        multiple: true
        required: false
        hint: "Shows a 'Prefer to book it yourself?' box with these partners' links (plus the disclosure note). Only pick partners that fit the article. Leave empty for none."
        options:
          - { label: "Viator — excursions, tours, shore excursions, transfers", value: "viator" }
          - { label: "Virgin Voyages — cruise", value: "virgin-voyages" }
          - { label: "Viking Ocean Cruises — cruise", value: "viking-ocean" }
          - { label: "Sandals Resorts — weddings, honeymoons, couples getaways", value: "sandals" }
          - { label: "Beaches Resorts — weddings, honeymoons, family getaways", value: "beaches" }
          - { label: "Culture Holidays — package vacations (hotel and tours)", value: "culture-holidays" }
          - { label: "Exoticca — flights, hotels, tours", value: "exoticca" }
      - { label: "'Plan My Trip' link details (optional, e.g. destination=Japan)", name: "plan_query", widget: "string", required: false }
      - { label: "Updated date (optional — only if you revise the post)", name: "updated", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: false }
      - { label: "SEO title (optional — defaults to the title)", name: "seo_title", widget: "string", required: false }
      - { label: "SEO description (optional — defaults to the summary)", name: "seo_description", widget: "text", required: false }
      - { label: "Keywords", name: "keywords", widget: "list", required: false }
      # Set by the migration from the old blog; powers the permanent redirects. Never edit.
      - { label: "Old blog address", name: "legacy_url", widget: "hidden", required: false }

  # ---------------------------------------------------------------
  # Single-page / site-wide settings — each is one editable "file"
  # ---------------------------------------------------------------
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "site"
        label: "Business Info & Navigation"
        file: "src/_data/site.json"
        fields:
          - { label: "Business Name", name: "business_name", widget: "string" }
          - { label: "Advisor Name", name: "advisor_name", widget: "string" }
          - { label: "Advisor Role/Title", name: "advisor_role", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone (displayed)", name: "phone", widget: "string" }
          - { label: "Phone Link (tel:+1XXXXXXXXXX)", name: "phone_link", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Affiliations", name: "affiliations", widget: "list", field: { label: "Name", name: "item", widget: "string" } }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Twitter / X", name: "twitter", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "Pinterest", name: "pinterest", widget: "string", required: false }
          - { label: "Blog URL", name: "blog_url", widget: "string" }
          - label: "Top Navigation Menu"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "url", widget: "string" }

      - name: "home"
        label: "Homepage"
        file: "src/_data/home.json"
        fields:
          - { label: "Eyebrow (small text above headline)", name: "hero_eyebrow", widget: "string" }
          - { label: "Main Headline", name: "hero_heading", widget: "string" }
          - { label: "Subheading", name: "hero_subheading", widget: "text" }
          - { label: "Hero Background Photo", name: "hero_image", widget: "image" }
          - { label: "Main Button Text", name: "hero_cta_label", widget: "string" }
          - { label: "Secondary Button Text", name: "hero_secondary_cta_label", widget: "string" }
          - { label: '"Why an advisor" Heading', name: "why_advisor_heading", widget: "string" }
          - { label: '"Why an advisor" Paragraph', name: "why_advisor_body", widget: "text" }
          - label: "Three Reasons to Use an Advisor"
            name: "why_advisor_points"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
          - label: "Hero Trust Strip (short labels under the hero)"
            name: "hero_strip"
            widget: "list"
            field: { label: "Label", name: "item", widget: "string" }
          - { label: "Services Section Heading", name: "services_heading", widget: "string" }
          - { label: "Services Section Subheading", name: "services_subheading", widget: "string" }
          - { label: '"How it works" Heading', name: "process_heading", widget: "string" }
          - { label: '"How it works" Intro', name: "process_body", widget: "text" }
          - label: "How It Works Steps"
            name: "process_steps"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Step Title", name: "title", widget: "string" }
              - { label: "Step Description", name: "body", widget: "text" }
          - { label: '"How it works" Button Text', name: "process_cta_label", widget: "string" }
          - { label: '"Who you will work with" Heading', name: "advisor_heading", widget: "string" }
          - { label: '"Who you will work with" Paragraph', name: "advisor_body", widget: "text" }
          - { label: "Destinations Section Heading", name: "destinations_heading", widget: "string" }
          - { label: "Destinations Section Subheading", name: "destinations_subheading", widget: "string" }
          - { label: "Bottom Call-To-Action Heading", name: "final_cta_heading", widget: "string" }
          - { label: "Bottom Call-To-Action Paragraph", name: "final_cta_body", widget: "text" }
          - { label: "Bottom Button Text", name: "final_cta_label", widget: "string" }

      - name: "about"
        label: "About Page"
        file: "src/_data/about.json"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Intro Sentence", name: "intro", widget: "text" }
          - { label: "Main Paragraph", name: "body", widget: "text" }
          - { label: "Second Paragraph", name: "body_two", widget: "text" }
          - { label: "Photo (a headshot of Soukeyna works best)", name: "image", widget: "image" }
          - { label: "Photo description for screen readers (e.g. 'Soukeyna smiling on a beach')", name: "image_alt", widget: "string", required: false }
          - { label: '"What to expect" Heading', name: "expect_heading", widget: "string" }
          - label: "What To Expect Points"
            name: "expect_points"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
          - { label: "Certifications Heading", name: "specialties_heading", widget: "string" }
          - label: "Certifications & Affiliations (only add REAL ones)"
            name: "specialties"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }

      - name: "services"
        label: "Services Page"
        file: "src/_data/services.json"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Intro Paragraph", name: "intro", widget: "text" }
          - label: "Service Categories"
            name: "categories"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Internal ID (no spaces, e.g. cruises)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["castle", "ship", "palm", "heart"]
              - { label: "Photo (optional; replaces the icon on the homepage card)", name: "image", widget: "image", required: false }
              - { label: "Who it's for (one line)", name: "who", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
              - { label: "Button Text", name: "cta_label", widget: "string" }

      - name: "contact"
        label: "Contact Page"
        file: "src/_data/contact.json"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Intro Paragraph", name: "intro", widget: "text" }
          - { label: "Form Success Heading", name: "form_success_heading", widget: "string" }
          - { label: "Form Success Message", name: "form_success_body", widget: "text" }
          - label: "Frequently Asked Questions"
            name: "faq"
            widget: "list"
            summary: "{{question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  # ---------------------------------------------------------------
  # Repeatable content — click "New" to add another card
  # ---------------------------------------------------------------
  - name: "destinations"
    label: "Destinations"
    folder: "src/content/destinations"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Region / Kicker (e.g. French Polynesia)", name: "kicker", widget: "string", required: false }
      - { label: "Photo (leave empty to show the branded pattern)", name: "image", widget: "image", required: false }
      - { label: "Link (a blog post URL, or leave blank to link to the contact form)", name: "link", widget: "string", required: false }
      - { label: "Display Order (lower numbers show first)", name: "order", widget: "number", default: 10 }
      - { label: "Short Description", name: "body", widget: "markdown" }

  - name: "testimonials"
    label: "Testimonials"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    summary: "{{name}} — {{trip}}"
    fields:
      - { label: "Client Name (first name + last initial is fine)", name: "name", widget: "string" }
      - { label: "Trip (e.g. Cancun Cruise)", name: "trip", widget: "string", required: false }
      - { label: "Display Order", name: "order", widget: "number", default: 10 }
      - { label: "Quote", name: "body", widget: "markdown" }